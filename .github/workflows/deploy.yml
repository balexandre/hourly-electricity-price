name: Update prices & deploy

on:
  push:
    branches: ["master"]
  schedule:
    # Cron is in UTC and often runs 5-30 min late. notify.mjs works out what is due in Copenhagen time,
    # so extra or late runs never send twice.
    - cron: '5 5 * * *'    # 07:05 Copenhagen in summer → today's overview
    - cron: '5 6 * * *'    # 07:05 Copenhagen in winter → today's overview
    - cron: '15 14 * * *'  # tomorrow's prices are out (published ~13:00) → tomorrow's overview
    - cron: '15 16 * * *'  # retry, in case tomorrow's prices were late
  workflow_dispatch:
    inputs:
      notify:
        description: Notification to send
        type: choice
        options: [auto, today, tomorrow]
        default: auto

# Runs queue up instead of racing each other to push data/
concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch prices
        run: node scripts/fetch-prices.mjs

      - name: Notify family
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY: ${{ inputs.notify || 'auto' }}
        run: node scripts/notify.mjs "$NOTIFY"

      # Runs even if the notification failed, so the site still gets fresh prices
      - name: Commit data
        id: commit
        if: ${{ !cancelled() }}
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update prices"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy from here
  deploy:
    needs: update
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.update.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Branch ref (not the triggering SHA) so the data commit made above is included
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
