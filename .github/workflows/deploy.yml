name: Update prices & deploy

on:
  push:
    branches: ["master"]
  schedule:
    # Hourly through the day: 05:10-21:10 UTC is 06:10-22:10 Copenhagen in winter, 07:10-23:10 in summer.
    # Cron often runs 5-30 min late; notify.mjs works out what is due in Copenhagen time and never sends twice.
    - cron: '10 5-21 * * *'
  workflow_dispatch:
    inputs:
      notify:
        description: Notification to send
        type: choice
        options: [auto, today, tomorrow, reminder]
        default: auto

# Runs queue up instead of racing each other to push data/
concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      prices_changed: ${{ steps.commit.outputs.prices_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch prices
        run: node scripts/fetch-prices.mjs

      - name: Notify family
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY: ${{ inputs.notify || 'auto' }}
        run: node scripts/notify.mjs "$NOTIFY"

      # Runs even if the notification failed, so the site still gets fresh prices
      - name: Commit data
        id: commit
        if: ${{ !cancelled() }}
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          # Only new prices need a redeploy; a sent-log update alone doesn't change the site
          if ! git diff --cached --quiet -- data/prices.json; then
            echo "prices_changed=true" >> "$GITHUB_OUTPUT"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update data"
          git pull --rebase
          git push

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy from here
  deploy:
    needs: update
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.update.outputs.prices_changed == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Branch ref (not the triggering SHA) so the data commit made above is included
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
