name: Update prices & deploy

on:
  push:
    branches: ["master"]
  # GitHub often starts scheduled runs hours late or skips them, so cron-job.org starts the runs on time
  # through workflow_dispatch (scripts/cron-job-setup.mjs). This schedule stays as the backup.
  # Every step works out what's due in Copenhagen time, so the extra tries change nothing.
  schedule:
    # Prices: tomorrow's come out around 13:00. The first try that finds them switches the car on for a cheap
    # afternoon and hands ntfy all of tomorrow's notifications; the rest find nothing new.
    # 11:15-13:45 UTC is 12:15-14:45 Copenhagen in winter, 13:15-15:45 in summer.
    - cron: '15,45 11-13 * * *'
    # Car: switches the afternoon charging back off before it would start again at 12:00.
    # 05:00 and 07:00 UTC is 06:00 and 08:00 Copenhagen in winter, 07:00 and 09:00 in summer.
    - cron: '0 5,7 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [prices, car]
        default: prices
      notify:
        description: Notification to send (prices only)
        type: choice
        options: [auto, tomorrow, reminder]
        default: auto

# Runs queue up instead of racing each other to push data/
concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The morning run only touches the car; everything else is a prices run
      TASK: ${{ github.event.schedule == '0 5,7 * * *' && 'car' || inputs.task || 'prices' }}
    outputs:
      site_outdated: ${{ steps.site.outputs.outdated }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch prices
        id: fetch
        if: ${{ env.TASK == 'prices' }}
        run: node scripts/fetch-prices.mjs

      # On every run, car runs included, so the site's wind forecast is fresh in the morning and after lunch.
      # The script skips it when the file is under 4 hours old, so retries don't commit it again.
      # Only the web page reads it, so a failure here mustn't stop the car or the notifications.
      - name: Fetch wind forecast
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/fetch-wind.mjs

      # Tesla's signing tool, built once and then restored from the cache
      - name: Cache tesla-control
        id: tesla-control
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tesla-control
          key: tesla-control-v0.4.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/tesla-control-schedule-id.patch') }}

      - name: Setup Go
        if: ${{ steps.tesla-control.outputs.cache-hit != 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      # Patched, because upstream ignores the schedule ID and would add a new schedule on every switch
      - name: Build tesla-control
        if: ${{ steps.tesla-control.outputs.cache-hit != 'true' }}
        env:
          CGO_ENABLED: 0
        run: |
          git clone --depth 1 --branch v0.4.1 https://github.com/teslamotors/vehicle-command "$RUNNER_TEMP/vehicle-command"
          cd "$RUNNER_TEMP/vehicle-command"
          git apply "$GITHUB_WORKSPACE/.github/tesla-control-schedule-id.patch"
          go build -o "$RUNNER_TEMP/tesla-control" ./cmd/tesla-control

      # Before the notifications, so tomorrow's overview can say where the car charges.
      # On the morning run it switches the afternoon charging off, on a prices run on when the plan says so.
      - name: Tesla afternoon charging
        env:
          TESLA_CLIENT_ID: ${{ secrets.TESLA_CLIENT_ID }}
          TESLA_VIN: ${{ secrets.TESLA_VIN }}
          TESLA_SCHEDULE_ID: ${{ secrets.TESLA_SCHEDULE_ID }}
          TESLA_REFRESH_TOKEN: ${{ secrets.TESLA_REFRESH_TOKEN }}
          TESLA_PRIVATE_KEY: ${{ secrets.TESLA_PRIVATE_KEY }}
          TESLA_CONTROL: ${{ runner.temp }}/tesla-control
          # Lets the script store Tesla's new single-use refresh token back into TESLA_REFRESH_TOKEN
          GH_TOKEN: ${{ secrets.TESLA_GH_TOKEN }}
        run: node scripts/tesla-charge.mjs

      # Runs even if the car couldn't be reached, so the family still hears about prices
      - name: Notify family
        if: ${{ !cancelled() && env.TASK == 'prices' && steps.fetch.outcome == 'success' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY: ${{ inputs.notify || 'auto' }}
        run: node scripts/notify.mjs "$NOTIFY"

      # Runs even if the notification failed, so the site still gets fresh prices
      - name: Commit data
        id: commit
        if: ${{ !cancelled() }}
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update data"
          git pull --rebase
          git push

      # Compares what the site serves with data/ rather than asking whether this run changed anything, so a deploy
      # that failed is caught up by the next run. Before, the later tries found no new prices and skipped deploying,
      # and the site went without tomorrow's prices until the data next changed.
      # Only the files the page reads matter: prices (with the car's charging plan) and the wind forecast.
      - name: Check the site is up to date
        id: site
        if: ${{ !cancelled() }}
        env:
          SITE_URL: https://balexandre.github.io/hourly-electricity-price/
        run: |
          for file in data/prices.json data/wind.json; do
            # The query string gets past the CDN's cached copy; a download that fails counts as out of date
            if ! curl -fsS --max-time 20 -o "$RUNNER_TEMP/served" "$SITE_URL$file?run=$GITHUB_RUN_ID" ||
               ! cmp -s "$RUNNER_TEMP/served" "$file"; then
              echo "The site's $file isn't the latest, deploying."
              echo "outdated=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "The site is up to date."

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy from here.
  # A push deploys the new code; the timed runs (scheduled or from cron-job.org) only when the site's data is behind.
  deploy:
    needs: update
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.update.outputs.site_outdated == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # Branch ref (not the triggering SHA) so the data commit made above is included
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # Right after the upload, GitHub sometimes doesn't list the artifact yet and the deploy fails with
      # 'No artifacts named "github-pages" were found'. It shows up seconds later, so wait and deploy again.
      # Not by re-running the job: that uploads a second artifact and fails on finding two.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait for the artifact
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 30

      - name: Deploy to GitHub Pages (second try)
        id: retry
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
